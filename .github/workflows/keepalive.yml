name: Keep Render warm

# Render's free web service spins down after ~15 min of inactivity. A cold start
# can exceed Telegram's 10s pre_checkout window (Stars payments) and stalls the
# in-process post scheduler. This pings /api/health often enough to keep the
# instance awake. Free + unlimited because the repo is public.
#
# NOTE: GitHub's scheduled runs are best-effort and can be delayed several minutes
# under load, and scheduled workflows auto-disable after 60 days with no repo
# activity. For a hard guarantee, also add an external monitor (e.g. UptimeRobot
# or cron-job.org) hitting the same URL, or move Render off the free tier.

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 40 --retry 2 --retry-delay 10 \
            https://content-factory-api.onrender.com/api/health \
            || echo "Ping did not return OK (likely a slow cold start) — non-fatal."
