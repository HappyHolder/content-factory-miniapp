<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<style>
  @font-face{font-family:'Barlow';src:url('barlow-800.woff2') format('woff2');font-weight:800;font-style:normal}
  @font-face{font-family:'Barlow';src:url('barlow-700.woff2') format('woff2');font-weight:700;font-style:normal}
  @font-face{font-family:'Inter';src:url('inter.woff2') format('woff2');font-weight:400 700;font-style:normal}
  :root{ --primary:#4DB8FF; --bg:#0F1011; --logo:none; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1080px;position:relative;overflow:hidden;isolation:isolate;background:var(--bg);color:#fff;
    font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;
    background-image:
      linear-gradient(color-mix(in srgb,var(--primary) 9%,transparent) 1px,transparent 1px),
      linear-gradient(90deg,color-mix(in srgb,var(--primary) 9%,transparent) 1px,transparent 1px),
      linear-gradient(color-mix(in srgb,var(--primary) 3.5%,transparent) 1px,transparent 1px),
      linear-gradient(90deg,color-mix(in srgb,var(--primary) 3.5%,transparent) 1px,transparent 1px);
    background-size:150px 150px,150px 150px,37px 37px,37px 37px}
  body.photo-mode{background-image:none}

  .top,.main,.bottom{position:relative;z-index:2}
  .top{display:flex;align-items:center;justify-content:space-between;padding:0 60px;height:104px;border-bottom:2px solid var(--primary);background:rgba(10,12,16,.55)}
  body.photo-mode .top,body.photo-mode .bottom{background:rgba(6,8,10,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .top .l{font-family:'Fira Code','SF Mono',monospace;color:var(--primary);font-size:34px;letter-spacing:.1em}
  .top .r{font-family:'Fira Code','SF Mono',monospace;color:rgba(255,255,255,.7);font-size:28px;letter-spacing:.14em;text-transform:uppercase}
  .top .r:empty{display:none}

  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px;gap:32px}
  body.photo-mode .main{text-shadow:0 3px 20px rgba(0,0,0,.55)}
  .pill{display:inline-flex;align-items:center;gap:12px;font-family:'Fira Code','SF Mono',monospace;font-weight:500;font-size:25px;letter-spacing:.16em;text-transform:uppercase;color:var(--bg);background:var(--primary);padding:13px 26px;border-radius:6px;box-shadow:0 8px 28px color-mix(in srgb,var(--primary) 40%,transparent);text-shadow:none}
  .pill:empty{display:none}
  .pill .dot{width:10px;height:10px;border-radius:50%;background:var(--bg)}
  .h1{font-family:'Barlow',sans-serif;font-weight:700;text-transform:uppercase;font-size:156px;line-height:.88;letter-spacing:-.02em}
  .h1 .a{color:var(--primary)}
  .desc{font-family:'Inter',sans-serif;font-size:33px;font-weight:500;line-height:1.4;color:rgba(255,255,255,.8);max-width:760px}
  .desc:empty{display:none}

  .metrics{display:flex;align-items:center;justify-content:center;gap:52px;margin-top:12px}
  .metric{display:flex;flex-direction:column;align-items:center;gap:10px}
  .metric:has(.v:empty){display:none}
  .metric .v{font-family:'Barlow',sans-serif;font-weight:700;font-size:70px;line-height:1;color:var(--primary);letter-spacing:-.01em}
  .metric .k{font-family:'Fira Code','SF Mono',monospace;font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .divider{width:1px;height:86px;background:color-mix(in srgb,var(--primary) 30%,transparent)}
  .metric:has(.v:empty)+.divider,.divider:last-child{display:none}

  .bottom{display:flex;align-items:center;justify-content:space-between;padding:0 60px;height:92px;border-top:2px solid var(--primary)}
  .tags{font-family:'Fira Code','SF Mono',monospace;font-size:26px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.72)}
  .tags .t{margin-right:14px}
  .tags .t::before{content:'/// ';color:var(--primary)}
  .tags .t:empty{margin:0}
  .tags .t:empty::before{content:none}
  .handle{font-family:'Fira Code','SF Mono',monospace;font-size:28px;color:var(--primary)}
</style>
</head>
<body>
  <div class="top"><span class="l">// {{RUBRIC}}</span><span class="r">{{TOP_TAG}}</span></div>
  <div class="main">
    <span class="pill"><span class="dot"></span>{{STATUS}}</span>
    <div class="h1"><span class="w">{{TITLE_WHITE}} </span><span class="a">{{TITLE_ACCENT}}</span></div>
    <div class="desc">{{DESC}}</div>
    <div class="metrics">
      <div class="metric"><div class="v">{{M1_VALUE}}</div><div class="k">{{M1_LABEL}}</div></div>
      <div class="divider"></div>
      <div class="metric"><div class="v">{{M2_VALUE}}</div><div class="k">{{M2_LABEL}}</div></div>
      <div class="divider"></div>
      <div class="metric"><div class="v">{{M3_VALUE}}</div><div class="k">{{M3_LABEL}}</div></div>
    </div>
  </div>
  <div class="bottom">
    <span class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></span>
    <span class="handle">{{AUTHOR}}</span>
  </div>
</body>
</html>
