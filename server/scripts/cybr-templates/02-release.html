<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#D4FF00; --bg:#0A0A0B; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--bg); color:#F2F2F0; position:relative; overflow:hidden;
    font-family:'JetBrains Mono', monospace; display:flex; flex-direction:column; padding:64px 64px 84px; }
  .scan { position:absolute; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 4px); }
  .hazard { position:absolute; left:0; right:0; bottom:0; height:18px; z-index:3;
    background:repeating-linear-gradient(45deg, var(--primary) 0 26px, transparent 26px 52px); }

  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; }
  .topbar { display:flex; align-items:stretch; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:16px; border:2px solid rgba(242,242,240,0.9); padding:14px 26px;
    font-family:'Unbounded'; font-weight:700; font-size:30px; text-transform:uppercase; letter-spacing:0.02em; }
  .brand .mark { width:22px; height:22px; background:var(--primary); flex-shrink:0; }
  .rubric-badge { background:var(--primary); color:#0A0A0B; font-weight:700; font-size:26px; letter-spacing:0.08em;
    text-transform:uppercase; padding:14px 26px; display:flex; align-items:center; gap:12px; }
  .rubric-badge::after { content:'↗'; font-weight:700; }

  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; }
  /* Терминальное окно релиза */
  .term { border:2px solid rgba(242,242,240,0.30); background:rgba(242,242,240,0.03); }
  .term-head { display:flex; align-items:center; gap:14px; padding:18px 28px; border-bottom:2px solid rgba(242,242,240,0.30);
    font-size:24px; color:#B8B8B4; letter-spacing:0.06em; }
  .term-head .dot { width:16px; height:16px; border:2px solid rgba(242,242,240,0.5); }
  .term-head .dot.on { background:var(--primary); border-color:var(--primary); }
  .term-head .fname { margin-left:12px; }
  .term-body { padding:44px 48px 48px; display:flex; flex-direction:column; gap:30px; }
  .prodrow { display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
  .product { font-family:'Unbounded'; font-weight:800; font-size:84px; line-height:1.1; text-transform:uppercase; letter-spacing:-0.01em; }
  .ver { background:var(--primary); color:#0A0A0B; font-weight:700; font-size:34px; padding:10px 22px; letter-spacing:0.04em; }
  .ver:empty { display:none; }
  .subtitle { font-size:34px; line-height:1.45; color:#E4E4E0; max-width:840px; }
  .feats { display:flex; flex-direction:column; gap:16px; }
  .feat { font-size:29px; color:#D8D8D4; display:flex; gap:14px; align-items:baseline; }
  .feat::before { content:'>'; color:var(--primary); font-weight:700; }
  .feat:has(span:empty) { display:none; }

  .bottom { display:flex; align-items:center; justify-content:space-between; margin-top:36px; }
  .tags { display:flex; gap:14px; }
  .tags .t { border:1.5px solid rgba(242,242,240,0.35); padding:10px 22px; font-size:26px; color:#E8E8E4; }
  .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:26px; color:#C9C9C4; }
  .handle::before { content:'//'; color:var(--primary); font-weight:700; }

  /* Гибрид (фото-фон): терминал — непрозрачнее, от токенов канала */
  .photo-mode .term { background:color-mix(in srgb, var(--bg) 68%, transparent); backdrop-filter:blur(16px); }
  .photo-mode .tags .t { background:color-mix(in srgb, var(--bg) 50%, transparent); }
  .photo-mode .scan { opacity:0.5; }
</style>
</head>
<body>
  <div class="scan"></div>
  <div class="hazard"></div>
  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="mark"></span>{{BRAND}}</div>
      <div class="rubric-badge">{{RUBRIC}}</div>
    </div>
    <div class="hero">
      <div class="term">
        <div class="term-head">
          <span class="dot on"></span><span class="dot"></span><span class="dot"></span>
          <span class="fname">RELEASE_NOTES.TXT</span>
        </div>
        <div class="term-body">
          <div class="prodrow"><span class="product">{{PRODUCT}}</span><span class="ver">{{VERSION}}</span></div>
          <div class="subtitle">{{SUBTITLE}}</div>
          <div class="feats">
            <div class="feat"><span>{{FEAT1}}</span></div>
            <div class="feat"><span>{{FEAT2}}</span></div>
            <div class="feat"><span>{{FEAT3}}</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom">
      <div class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></div>
      <div class="handle">{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
