<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#D4FF00; --bg:#0A0A0B; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--bg); color:#F2F2F0; position:relative; overflow:hidden;
    font-family:'JetBrains Mono', monospace; display:flex; flex-direction:column; padding:64px 64px 84px; }
  .scan { position:absolute; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 4px); }
  .hazard { position:absolute; left:0; right:0; bottom:0; height:18px; z-index:3;
    background:repeating-linear-gradient(45deg, var(--primary) 0 26px, transparent 26px 52px); }

  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; gap:34px; }
  .topbar { display:flex; align-items:stretch; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:16px; border:2px solid rgba(242,242,240,0.9); padding:14px 26px;
    font-family:'Unbounded'; font-weight:700; font-size:30px; text-transform:uppercase; letter-spacing:0.02em; }
  .brand .mark { width:22px; height:22px; background:var(--primary); flex-shrink:0; }
  .rubric-badge { background:var(--primary); color:#0A0A0B; font-weight:700; font-size:26px; letter-spacing:0.08em;
    text-transform:uppercase; padding:14px 26px; display:flex; align-items:center; gap:12px; }
  .rubric-badge::after { content:'↗'; font-weight:700; }

  /* Манифест: кислотная карточка, чёрный текст — читается на любом фоне */
  .card { flex:1; min-height:0; overflow:hidden; background:var(--primary); color:#0A0A0B; padding:64px 68px;
    display:flex; flex-direction:column; justify-content:center; gap:40px; position:relative; }
  .card::before, .card::after { content:''; position:absolute; width:26px; height:26px; border:3.5px solid #0A0A0B; }
  .card::before { top:16px; left:16px; border-right:none; border-bottom:none; }
  .card::after { bottom:16px; right:16px; border-left:none; border-top:none; }
  .sys { font-size:25px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.55; }
  .quote { font-family:'Unbounded'; font-weight:800; font-size:62px; line-height:1.16; text-transform:uppercase;
    letter-spacing:-0.01em; }
  .quote .accent { background:#0A0A0B; color:var(--primary); padding:0 16px; box-decoration-break:clone;
    -webkit-box-decoration-break:clone; }
  .author { display:flex; align-items:center; gap:20px; }
  .avatar { width:64px; height:64px; background:#0A0A0B; background-image:var(--logo); background-size:cover; background-position:center; flex-shrink:0; }
  .author .name { font-size:32px; font-weight:700; }
  .author .role { font-size:26px; opacity:0.6; margin-top:4px; }

  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:14px; }
  .tags .t { border:1.5px solid rgba(242,242,240,0.35); padding:10px 22px; font-size:26px; color:#E8E8E4; }
  .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:26px; color:#C9C9C4; }
  .handle::before { content:'//'; color:var(--primary); font-weight:700; }

  /* Гибрид: карточка непрозрачная кислотная — адаптация не нужна, только чипы */
  .photo-mode .tags .t { background:color-mix(in srgb, var(--bg) 50%, transparent); }
  .photo-mode .scan { opacity:0.4; }
</style>
</head>
<body>
  <div class="scan"></div>
  <div class="hazard"></div>
  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="mark"></span>{{BRAND}}</div>
      <div class="rubric-badge">{{RUBRIC}}</div>
    </div>
    <div class="card">
      <div class="sys">// MANIFESTO_MODE</div>
      <div class="quote"><span class="white">{{QUOTE_WHITE}} </span><span class="accent">{{QUOTE_ACCENT}}</span></div>
      <div class="author">
        <span class="avatar"></span>
        <span><div class="name">{{AUTHOR_NAME}}</div><div class="role">{{AUTHOR_ROLE}}</div></span>
      </div>
    </div>
    <div class="bottom">
      <div class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></div>
      <div class="handle">{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
