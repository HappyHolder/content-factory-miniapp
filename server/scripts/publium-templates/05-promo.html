<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#FF6A00; --bg:#070708; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--bg); color:#FFFFFF; position:relative; overflow:hidden;
    font-family:'Onest', system-ui, sans-serif; display:flex; flex-direction:column; padding:72px; }
  .glowspot { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:900px; height:700px; z-index:0;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--primary) 16%, transparent) 0%, transparent 62%); }

  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; gap:32px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:14px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.09); border-radius:100px; padding:14px 28px;
    font-size:30px; font-weight:700; }
  .brand .dot { width:20px; height:20px; border-radius:50%; background:var(--primary);
    box-shadow:0 0 22px color-mix(in srgb, var(--primary) 60%, transparent); }
  .rubric-pill { background:var(--primary); color:#FFFFFF; font-weight:800; font-size:26px;
    letter-spacing:0.04em; text-transform:uppercase; padding:14px 28px; border-radius:100px;
    box-shadow:0 0 44px color-mix(in srgb, var(--primary) 40%, transparent); }

  /* Светлый купон — контраст в тёмной ленте */
  .coupon { flex:1; min-height:0; overflow:hidden; background:#F5F3EF; color:#0D0D0F; border-radius:36px;
    padding:60px 64px; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; gap:30px; position:relative; }
  .coupon .half-l, .coupon .half-r { position:absolute; top:50%; width:52px; height:52px; border-radius:50%;
    background:var(--bg); transform:translateY(-50%); }
  .coupon .half-l { left:-26px; } .coupon .half-r { right:-26px; }
  .promo-label { font-size:30px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#8A8A85; }
  .discount { font-weight:800; font-size:76px; line-height:1.1; letter-spacing:-0.02em; max-width:820px; }
  .discount .accent { color:var(--primary); }
  .codebox { border:3px dashed color-mix(in srgb, var(--primary) 65%, transparent); border-radius:24px;
    background:color-mix(in srgb, var(--primary) 8%, transparent); padding:28px 56px; }
  .code { font-family:'JetBrains Mono', monospace; font-weight:700; font-size:72px; letter-spacing:0.12em;
    color:var(--primary); text-transform:uppercase; line-height:1.15; }
  .valid { font-size:28px; color:#7A7A75; }
  .valid:empty { display:none; }

  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:12px; }
  .tags .t { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09);
    border-radius:100px; padding:11px 24px; font-size:26px; color:#D9D9DE; }
  .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:27px; color:#A1A1AA; }
  .handle .logo { width:36px; height:36px; border-radius:50%; background:#111114; background-image:var(--logo);
    background-size:cover; background-position:center; }

  /* Гибрид: купон непрозрачный — только чипы; вырезы купона глушим (фон под ними — фото) */
  .photo-mode .brand, .photo-mode .tags .t { background:color-mix(in srgb, var(--bg) 52%, transparent); backdrop-filter:blur(10px); }
  .photo-mode .coupon .half-l, .photo-mode .coupon .half-r { display:none; }
</style>
</head>
<body>
  <div class="glowspot"></div>
  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>{{BRAND}}</div>
      <div class="rubric-pill">{{RUBRIC}}</div>
    </div>
    <div class="coupon">
      <span class="half-l"></span><span class="half-r"></span>
      <div class="promo-label">Промокод</div>
      <div class="discount"><span class="white">{{DISCOUNT_WHITE}} </span><span class="accent">{{DISCOUNT_ACCENT}}</span></div>
      <div class="codebox"><div class="code">{{CODE}}</div></div>
      <div class="valid">{{VALID}}</div>
    </div>
    <div class="bottom">
      <div class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></div>
      <div class="handle"><span class="logo"></span>{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
