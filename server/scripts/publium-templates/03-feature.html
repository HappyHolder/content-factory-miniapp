<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#FF6A00; --bg:#070708; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--bg); color:#FFFFFF; position:relative; overflow:hidden;
    font-family:'Onest', system-ui, sans-serif; display:flex; flex-direction:column; padding:72px; }
  /* Текстура: точечная сетка */
  .tex { position:absolute; inset:0; z-index:1; pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,0.055) 1.5px, transparent 1.5px);
    background-size:38px 38px; }
  .glowspot { position:absolute; bottom:-280px; left:-220px; width:820px; height:760px; z-index:0;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--primary) 18%, transparent) 0%, transparent 62%); }

  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:14px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.09); border-radius:100px; padding:14px 28px;
    font-size:30px; font-weight:700; }
  .brand .dot { width:20px; height:20px; border-radius:50%; background:var(--primary);
    box-shadow:0 0 22px color-mix(in srgb, var(--primary) 60%, transparent); }
  .rubric-pill { background:var(--primary); color:#FFFFFF; font-weight:800; font-size:26px;
    letter-spacing:0.04em; text-transform:uppercase; padding:14px 28px; border-radius:100px;
    box-shadow:0 0 44px color-mix(in srgb, var(--primary) 40%, transparent); }

  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; gap:36px; }
  .title { font-weight:800; font-size:92px; line-height:1.08; letter-spacing:-0.02em; max-width:930px; }
  .title .accent { color:var(--primary); }
  .lead { font-size:35px; line-height:1.42; color:#C9C9CF; max-width:860px; }

  /* Стеклянная панель с двумя пунктами — как карточка из приложения */
  .panel { display:flex; gap:20px; }
  .point { flex:1; background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.09);
    border-radius:26px; padding:30px 34px; display:flex; flex-direction:column; gap:14px; }
  .point .pi { width:46px; height:46px; border-radius:14px; background:color-mix(in srgb, var(--primary) 16%, transparent);
    border:1.5px solid color-mix(in srgb, var(--primary) 45%, transparent); display:flex; align-items:center;
    justify-content:center; color:var(--primary); font-weight:800; font-size:26px; }
  .point .pt { font-size:30px; line-height:1.35; color:#EDEDED; }
  .point:has(.pt:empty) { display:none; }

  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:12px; }
  .tags .t { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09);
    border-radius:100px; padding:11px 24px; font-size:26px; color:#D9D9DE; }
  .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:27px; color:#A1A1AA; }
  .handle .logo { width:36px; height:36px; border-radius:50%; background:#111114; background-image:var(--logo);
    background-size:cover; background-position:center; }

  /* Гибрид (фото-фон) */
  .photo-mode .point { background:color-mix(in srgb, var(--bg) 62%, transparent); backdrop-filter:blur(14px); }
  .photo-mode .brand, .photo-mode .tags .t { background:color-mix(in srgb, var(--bg) 52%, transparent); backdrop-filter:blur(10px); }
  .photo-mode .tex { opacity:0.4; }

  /* Есть логотип канала: показываем его в шапке вместо оранжевой точки */
  .has-logo .brand .dot { width:36px; height:36px; background:transparent; box-shadow:none;
    background-image:var(--logo); background-size:contain; background-repeat:no-repeat; background-position:center; }
</style>
</head>
<body>
  <div class="glowspot"></div>
  <div class="tex"></div>
  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>{{BRAND}}</div>
      <div class="rubric-pill">{{RUBRIC}}</div>
    </div>
    <div class="hero">
      <div class="title"><span class="white">{{TITLE_WHITE}} </span><span class="accent">{{TITLE_ACCENT}}</span></div>
      <div class="lead">{{LEAD}}</div>
      <div class="panel">
        <div class="point"><span class="pi">01</span><span class="pt">{{POINT1}}</span></div>
        <div class="point"><span class="pi">02</span><span class="pt">{{POINT2}}</span></div>
      </div>
    </div>
    <div class="bottom">
      <div class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></div>
      <div class="handle"><span class="logo"></span>{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
