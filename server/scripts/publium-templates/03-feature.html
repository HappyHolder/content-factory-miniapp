<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--primary:#FF6A00;--bg:#0A0A0C;--logo:none;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1080px;height:1080px;background:var(--bg);color:#F5F3EF;position:relative;overflow:hidden;font-family:'Onest',system-ui,sans-serif;}
  .grid{position:absolute;inset:0;z-index:0;background-image:radial-gradient(circle, rgba(255,255,255,0.05) 10.2px, transparent 10.799999999999999px);background-size:22px 22px;}
  .mol{position:absolute;inset:0;z-index:1;} .mol circle{fill:var(--primary);}
  .layer{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;padding:78px;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:16px;}
  .brand .lg{width:52px;height:52px;background-image:var(--logo);background-size:contain;background-repeat:no-repeat;background-position:center;}
  .brand .nm{font-size:32px;font-weight:700;letter-spacing:-0.01em;}
  .chip{display:inline-flex;align-items:center;gap:10px;background:var(--primary);color:#fff;font-weight:600;font-size:25px;padding:13px 22px;border-radius:14px;box-shadow:0 8px 30px rgba(255,106,0,0.32);}
  .chip svg{width:25px;height:25px;}
  .vchip{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 40%,transparent);border-radius:12px;padding:9px 18px;font-weight:700;font-size:26px;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);}
  .h{font-weight:800;line-height:0.99;letter-spacing:-0.03em;} .h .o{color:var(--primary);}
  .lead{color:#9A9AA2;line-height:1.4;}
  .cards{display:flex;flex-direction:column;gap:15px;}
  .card{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.10);border-radius:18px;padding:22px 26px;backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);}
  .card .ic{width:52px;height:52px;flex-shrink:0;border-radius:12px;background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary);display:flex;align-items:center;justify-content:center;}
  .card .ic svg{width:28px;height:28px;} .card .tx{font-size:29px;font-weight:600;line-height:1.25;}
  .card:has(.tx:empty){display:none;}
  .btn{display:inline-flex;align-items:center;gap:12px;background:var(--primary);color:#fff;font-weight:700;font-size:31px;padding:20px 38px;border-radius:16px;box-shadow:0 10px 40px rgba(255,106,0,0.34);}
  .btn svg{width:28px;height:28px;}
  .hero{flex:1;display:flex;flex-direction:column;justify-content:center;}
</style></head>
<body class="has-logo">
  <div class="grid"></div>
  <svg class="mol" viewBox="0 0 1080 1080"><circle cx="1023.0" cy="759.0" r="10.2"/><circle cx="979.0" cy="825.0" r="10.2"/><circle cx="1001.0" cy="825.0" r="10.2"/><circle cx="1045.0" cy="847.0" r="10.2"/><circle cx="1067.0" cy="847.0" r="10.2"/><circle cx="869.0" cy="869.0" r="10.2"/><circle cx="891.0" cy="869.0" r="10.2"/><circle cx="847.0" cy="891.0" r="10.2"/><circle cx="913.0" cy="891.0" r="10.2"/><circle cx="979.0" cy="891.0" r="10.2"/><circle cx="825.0" cy="913.0" r="10.2"/><circle cx="1067.0" cy="913.0" r="10.2"/><circle cx="1045.0" cy="935.0" r="10.2"/><circle cx="1067.0" cy="935.0" r="10.2"/><circle cx="781.0" cy="957.0" r="10.2"/><circle cx="869.0" cy="957.0" r="10.2"/><circle cx="979.0" cy="957.0" r="10.2"/><circle cx="781.0" cy="979.0" r="10.2"/><circle cx="869.0" cy="979.0" r="10.2"/><circle cx="913.0" cy="979.0" r="10.2"/><circle cx="869.0" cy="1001.0" r="10.2"/><circle cx="957.0" cy="1001.0" r="10.2"/><circle cx="979.0" cy="1001.0" r="10.2"/><circle cx="1001.0" cy="1001.0" r="10.2"/><circle cx="1023.0" cy="1001.0" r="10.2"/><circle cx="1045.0" cy="1001.0" r="10.2"/><circle cx="1067.0" cy="1001.0" r="10.2"/><circle cx="759.0" cy="1023.0" r="10.2"/><circle cx="781.0" cy="1023.0" r="10.2"/><circle cx="847.0" cy="1023.0" r="10.2"/><circle cx="869.0" cy="1023.0" r="10.2"/><circle cx="957.0" cy="1023.0" r="10.2"/><circle cx="979.0" cy="1023.0" r="10.2"/><circle cx="1067.0" cy="1023.0" r="10.2"/><circle cx="847.0" cy="1045.0" r="10.2"/><circle cx="869.0" cy="1045.0" r="10.2"/><circle cx="957.0" cy="1045.0" r="10.2"/><circle cx="979.0" cy="1045.0" r="10.2"/><circle cx="1023.0" cy="1045.0" r="10.2"/><circle cx="1045.0" cy="1045.0" r="10.2"/><circle cx="1067.0" cy="1045.0" r="10.2"/><circle cx="869.0" cy="1067.0" r="10.2"/><circle cx="979.0" cy="1067.0" r="10.2"/><circle cx="1001.0" cy="1067.0" r="10.2"/><circle cx="1067.0" cy="1067.0" r="10.2"/></svg>
  <div class="layer">
    <div class="top">
      <div class="brand"><span class="lg"></span><span class="nm">{{BRAND}}</span></div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L13.6 9.2 L20 12 L13.6 14.8 L12 21 L10.4 14.8 L4 12 L10.4 9.2 Z" fill="currentColor"/></svg>{{RUBRIC}}</div>
    </div>
    
    <div class="hero" style="justify-content:flex-start;margin-top:60px;">
      <div class="h" style="font-size:104px;max-width:820px;">{{TITLE_WHITE}} <span class="o">{{TITLE_ACCENT}}</span></div>
      <div class="lead" style="margin-top:32px;font-size:32px;max-width:520px;">{{LEAD}}</div>
      <div class="cards" style="margin-top:auto;max-width:660px;">
        <div class="card"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L13.6 9.2 L20 12 L13.6 14.8 L12 21 L10.4 14.8 L4 12 L10.4 9.2 Z" fill="currentColor"/></svg></span><span class="tx">{{POINT1}}</span></div>
        <div class="card"><span class="ic"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L13.6 9.2 L20 12 L13.6 14.8 L12 21 L10.4 14.8 L4 12 L10.4 9.2 Z" fill="currentColor"/></svg></span><span class="tx">{{POINT2}}</span></div>
      </div>
    </div>
  </div>
</body></html>
