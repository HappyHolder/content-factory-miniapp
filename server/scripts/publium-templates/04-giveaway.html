<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#FF6A00; --bg:#070708; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--bg); color:#FFFFFF; position:relative; overflow:hidden;
    font-family:'Onest', system-ui, sans-serif; display:flex; flex-direction:column; padding:72px; gap:32px; }

  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; gap:32px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:14px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.09); border-radius:100px; padding:14px 28px;
    font-size:30px; font-weight:700; }
  .brand .dot { width:20px; height:20px; border-radius:50%; background:var(--primary);
    box-shadow:0 0 22px color-mix(in srgb, var(--primary) 60%, transparent); }
  .rubric-pill { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.14); color:#FFFFFF;
    font-weight:800; font-size:26px; letter-spacing:0.04em; text-transform:uppercase; padding:14px 28px; border-radius:100px; }

  /* Оранжевая праздничная карточка — читается на любом фоне */
  .card { flex:1; min-height:0; overflow:hidden; position:relative; background:var(--primary); color:#FFFFFF;
    border-radius:36px; padding:64px 68px; display:flex; flex-direction:column; justify-content:center; gap:30px;
    box-shadow:0 0 90px color-mix(in srgb, var(--primary) 38%, transparent); }
  /* Текстура: рассыпанные звёздочки */
  .card .spark { position:absolute; font-size:56px; opacity:0.22; font-weight:800; }
  .card .s1 { top:44px; right:70px; font-size:88px; }
  .card .s2 { bottom:56px; left:52px; font-size:64px; }
  .card .s3 { top:52%; right:44px; font-size:44px; }
  .gw-label { font-family:'JetBrains Mono', monospace; font-size:28px; letter-spacing:0.22em;
    text-transform:uppercase; opacity:0.75; }
  .prize { font-weight:800; font-size:100px; line-height:1.06; letter-spacing:-0.02em; }
  .gw-sub { font-size:35px; line-height:1.4; max-width:820px; opacity:0.92; }
  .meta { display:flex; gap:18px; margin-top:8px; flex-wrap:wrap; }
  .meta .m { background:rgba(0,0,0,0.22); border-radius:100px; padding:16px 30px; font-size:29px; font-weight:700; }
  .meta .m:empty { display:none; }

  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:12px; }
  .tags .t { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09);
    border-radius:100px; padding:11px 24px; font-size:26px; color:#D9D9DE; }
  .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:27px; color:#A1A1AA; }
  .handle .logo { width:36px; height:36px; border-radius:50%; background:#111114; background-image:var(--logo);
    background-size:cover; background-position:center; }

  /* Гибрид: карточка непрозрачная — только чипы */
  .photo-mode .brand, .photo-mode .tags .t, .photo-mode .rubric-pill { background:color-mix(in srgb, var(--bg) 52%, transparent); backdrop-filter:blur(10px); }
</style>
</head>
<body>
  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="dot"></span>{{BRAND}}</div>
      <div class="rubric-pill">{{RUBRIC}}</div>
    </div>
    <div class="card">
      <span class="spark s1">✳</span><span class="spark s2">✳</span><span class="spark s3">✳</span>
      <div class="gw-label">// GIVEAWAY</div>
      <div class="prize">{{PRIZE}}</div>
      <div class="gw-sub">{{SUBTITLE}}</div>
      <div class="meta"><span class="m">{{DEADLINE}}</span><span class="m">{{COND}}</span></div>
    </div>
    <div class="bottom">
      <div class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></div>
      <div class="handle"><span class="logo"></span>{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
