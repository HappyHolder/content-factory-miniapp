<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#FF5422; --bg:#0B0B0C; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--bg); color:#fff; position:relative; overflow:hidden;
    font-family:'Space Grotesk', system-ui, sans-serif; display:flex; flex-direction:column; padding:72px; }
  .glow { position:absolute; top:-120px; right:-120px; width:560px; height:560px; z-index:0;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--primary) 22%, transparent) 0%, transparent 62%); }
  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; }
  .topbar { display:flex; align-items:center; justify-content:space-between; border:1px solid rgba(255,255,255,0.14); border-radius:100px; padding:14px 22px; }
  .brand { display:flex; align-items:center; gap:14px; font-size:30px; font-weight:500; } .brand .mark { color:var(--primary); font-size:32px; }
  .rubric-pill { background:var(--primary); color:#0B0B0C; font-weight:700; font-size:24px; letter-spacing:0.06em; text-transform:uppercase; padding:10px 22px; border-radius:100px; }

  .head { margin-top:54px; font-size:46px; font-weight:500; } .head .accent { color:var(--primary); }
  .grid { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:18px; align-content:center; margin:30px 0; }
  .mv { background:#16161A; border:1px solid rgba(255,255,255,0.08); border-radius:24px; padding:30px 32px; display:flex; align-items:center; justify-content:space-between; }
  .mv .tk { font-size:48px; font-weight:500; }
  .mv .pc { font-size:44px; font-weight:500; }
  .mv .pc.up { color:var(--primary); }
  .mv .pc.down { color:#8A8A8E; }

  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:12px; } .tags .t { border:1px solid rgba(255,255,255,0.16); border-radius:100px; padding:9px 20px; font-size:22px; color:#C8C8CC; } .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:24px; color:#8A8A8E; } .handle .logo { width:34px; height:34px; border-radius:50%; background-image:var(--logo); background-size:cover; background-position:center; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="layer">
    <div class="topbar"><div class="brand"><span class="mark">✳</span>{{BRAND}}</div><div class="rubric-pill">{{RUBRIC}}</div></div>
    <div class="head"><span class="white">{{HEAD_WHITE}} </span><span class="accent">{{HEAD_ACCENT}}</span></div>
    <div class="grid">
      <div class="mv"><span class="tk">{{TK1}}</span><span class="pc up">{{PC1}}</span></div>
      <div class="mv"><span class="tk">{{TK2}}</span><span class="pc up">{{PC2}}</span></div>
      <div class="mv"><span class="tk">{{TK3}}</span><span class="pc down">{{PC3}}</span></div>
      <div class="mv"><span class="tk">{{TK4}}</span><span class="pc down">{{PC4}}</span></div>
    </div>
    <div class="bottom">
      <div class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></div>
      <div class="handle"><span class="logo"></span>{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
