<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#FF5422; --bg:#0B0B0C; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--bg); color:#fff; position:relative; overflow:hidden;
    font-family:'Space Grotesk', system-ui, sans-serif; display:flex; flex-direction:column; padding:72px; }
  .glow { position:absolute; top:-120px; right:-120px; width:560px; height:560px; z-index:0;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--primary) 26%, transparent) 0%, transparent 62%); }

  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; gap:40px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; border:1px solid rgba(255,255,255,0.14); border-radius:100px; padding:14px 22px; }
  .brand { display:flex; align-items:center; gap:14px; font-size:30px; font-weight:500; }
  .brand .mark { color:var(--primary); font-size:32px; }
  .rubric-pill { background:var(--primary); color:#0B0B0C; font-weight:700; font-size:24px; letter-spacing:0.06em; text-transform:uppercase; padding:10px 22px; border-radius:100px; }

  /* Светлая карточка-герой с цитатой */
  .card { flex:1; background:#ECEAE3; color:#16161A; border-radius:32px; padding:64px; display:flex; flex-direction:column; justify-content:center; }
  .qmark { color:var(--primary); font-size:160px; line-height:0.5; height:80px; font-weight:700; }
  .quote { font-size:66px; font-weight:500; line-height:1.12; letter-spacing:-0.01em; }
  .quote .accent { color:var(--primary); }
  .author { display:flex; align-items:center; gap:18px; margin-top:44px; }
  .avatar { width:68px; height:68px; border-radius:50%; background:#16161A; background-image:var(--logo); background-size:cover; background-position:center; }
  .author .name { font-size:30px; font-weight:500; }
  .author .role { font-size:24px; color:#6A6A6E; }

  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:12px; }
  .tags .t { border:1px solid rgba(255,255,255,0.16); border-radius:100px; padding:9px 20px; font-size:22px; color:#C8C8CC; }
  .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:24px; color:#8A8A8E; }
  .handle .logo { width:34px; height:34px; border-radius:50%; background-image:var(--logo); background-size:cover; background-position:center; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="mark">✳</span>{{BRAND}}</div>
      <div class="rubric-pill">{{RUBRIC}}</div>
    </div>

    <div class="card">
      <div class="qmark">“</div>
      <div class="quote"><span class="white">{{QUOTE_WHITE}} </span><span class="accent">{{QUOTE_ACCENT}}</span></div>
      <div class="author">
        <span class="avatar"></span>
        <div><div class="name">{{AUTHOR_NAME}}</div><div class="role">{{AUTHOR_ROLE}}</div></div>
      </div>
    </div>

    <div class="bottom">
      <div class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></div>
      <div class="handle"><span class="logo"></span>{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
