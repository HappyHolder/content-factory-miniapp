<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#FF5422; --bg:#0B0B0C; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; background:var(--bg); color:#fff; position:relative; overflow:hidden;
    font-family:'Space Grotesk', system-ui, sans-serif; display:flex; flex-direction:column; padding:72px; }
  .glow { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); width:820px; height:680px; z-index:0;
    background:radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--primary) 30%, transparent) 0%, transparent 60%); }

  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; }
  .topbar { display:flex; align-items:center; justify-content:space-between; border:1px solid rgba(255,255,255,0.14); border-radius:100px; padding:14px 22px; }
  .brand { display:flex; align-items:center; gap:14px; font-size:32px; font-weight:700; }
  .brand .mark { color:var(--primary); font-size:32px; }
  .topright { display:flex; align-items:center; gap:12px; }
  .date-pill { border:1px solid rgba(255,255,255,0.28); border-radius:100px; padding:10px 22px; font-size:26px; color:#E0E0E4; }
  .rubric-pill { background:var(--primary); color:#0B0B0C; font-weight:700; font-size:28px; letter-spacing:0.06em; text-transform:uppercase; padding:12px 26px; border-radius:100px; }

  .hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:28px; }
  .planet { width:300px; height:300px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;
    background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--primary) 30%, transparent), #141416 70%);
    border:1px solid rgba(255,255,255,0.10); }
  .planet .pmark { width:96px; height:96px; border-radius:50%; background-image:var(--logo); background-size:contain; background-repeat:no-repeat; background-position:center; }
  .planet .pmark.empty { background:none; color:var(--primary); font-size:96px; display:flex; align-items:center; justify-content:center; }
  .new-badge { position:absolute; top:14px; right:14px; background:var(--primary); color:#0B0B0C; font-weight:700; font-size:20px; letter-spacing:0.08em; padding:7px 16px; border-radius:100px; }
  .project { font-size:122px; font-weight:700; line-height:1; letter-spacing:-0.02em; }
  .subtitle { font-size:38px; color:rgba(255,255,255,0.92); }
  .subtitle b { color:#fff; font-weight:500; }
  .arrow { width:74px; height:74px; border-radius:50%; border:1px solid rgba(255,255,255,0.22); display:flex; align-items:center; justify-content:center; font-size:34px; color:#fff; }

  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:12px; }
  .tags .t { border:1px solid rgba(255,255,255,0.30); border-radius:100px; padding:10px 24px; font-size:28px; color:#E6E6EA; }
  .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:28px; color:#B9B9BF; }
  .handle .logo { width:38px; height:38px; border-radius:50%; background-image:var(--logo); background-size:cover; background-position:center; }

  /* Гибрид (фото-фон): планета получает полупрозрачную подложку от фона канала */
  .photo-mode .planet { background:radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--primary) 34%, transparent), color-mix(in srgb, var(--bg) 82%, transparent) 70%); backdrop-filter:blur(10px); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="mark">✳</span>{{BRAND}}</div>
      <div class="topright">
        <span class="date-pill">{{DATE}}</span>
        <span class="rubric-pill">{{RUBRIC}}</span>
      </div>
    </div>

    <div class="hero">
      <div class="planet">
        <span class="pmark empty">✳</span>
        <span class="new-badge">{{BADGE}}</span>
      </div>
      <div class="project">{{PROJECT}}</div>
      <div class="subtitle">{{SUBTITLE}}</div>
      <div class="arrow">↗</div>
    </div>

    <div class="bottom">
      <div class="tags"><span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span></div>
      <div class="handle"><span class="logo"></span>{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
