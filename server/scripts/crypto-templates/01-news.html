<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Сервис вставляет сюда: <style>:root{--primary:...;--bg:...;--logo:url(...)}</style> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --primary:#FF5422; --bg:#0B0B0C; --logo:none; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1080px; height:1080px; background:var(--bg); color:#fff;
    position:relative; overflow:hidden; font-family:'Space Grotesk', system-ui, sans-serif;
    display:flex; flex-direction:column; padding:72px;
  }
  /* «Планета» — оранжевое свечение + концентрические круги (декор; в гибриде тут фото) */
  .glow { position:absolute; top:-160px; left:50%; transform:translateX(-50%); width:760px; height:760px; z-index:0;
    background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--primary) 38%, transparent) 0%, transparent 62%); }
  .rings { position:absolute; inset:0; z-index:0; }
  .rings i { position:absolute; left:50%; top:150px; transform:translate(-50%,-50%); border:1px solid rgba(255,255,255,0.06); border-radius:50%; }

  .layer { position:relative; z-index:2; display:flex; flex-direction:column; height:100%; }

  /* Верхняя пилюля-навбар */
  .topbar { display:flex; align-items:center; justify-content:space-between;
    border:1px solid rgba(255,255,255,0.14); border-radius:100px; padding:14px 22px; }
  .brand { display:flex; align-items:center; gap:14px; font-size:30px; font-weight:500; letter-spacing:0.01em; }
  .brand .mark { color:var(--primary); font-size:32px; }
  .rubric-pill { background:var(--primary); color:#0B0B0C; font-weight:700; font-size:24px; letter-spacing:0.06em;
    text-transform:uppercase; padding:10px 22px; border-radius:100px; }

  /* Герой */
  .hero { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:30px; }
  .title { font-size:104px; font-weight:500; line-height:1.0; letter-spacing:-0.02em; max-width:920px; }
  .title .accent { color:var(--primary); }
  .lead { font-size:32px; font-weight:400; color:#9A9AA0; line-height:1.45; max-width:760px; }

  /* Стат-блоки (пусто → схлопнутся) */
  .stats { display:flex; gap:80px; justify-content:center; margin-top:10px; }
  .stat { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .stat .v { font-size:52px; font-weight:500; line-height:1; }
  .stat .l { font-size:22px; color:#8A8A8E; }

  /* Низ: теги-пилюли + хэндл */
  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .tags { display:flex; gap:12px; }
  .tags .t { border:1px solid rgba(255,255,255,0.16); border-radius:100px; padding:9px 20px; font-size:22px; color:#C8C8CC; }
  .tags .t:empty { display:none; }
  .handle { display:flex; align-items:center; gap:12px; font-size:24px; color:#8A8A8E; }
  .handle .logo { width:34px; height:34px; border-radius:50%; background-image:var(--logo); background-size:cover; background-position:center; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="rings">
    <i style="width:560px;height:560px;"></i>
    <i style="width:860px;height:860px;"></i>
    <i style="width:1180px;height:1180px;"></i>
  </div>

  <div class="layer">
    <div class="topbar">
      <div class="brand"><span class="mark">✳</span>{{BRAND}}</div>
      <div class="rubric-pill">{{RUBRIC}}</div>
    </div>

    <div class="hero">
      <div class="title"><span class="white">{{TITLE_WHITE}} </span><span class="accent">{{TITLE_ACCENT}}</span></div>
      <div class="lead">{{LEAD}}</div>
      <div class="stats">
        <div class="stat"><div class="v">{{STAT1_VAL}}</div><div class="l">{{STAT1_LABEL}}</div></div>
        <div class="stat"><div class="v">{{STAT2_VAL}}</div><div class="l">{{STAT2_LABEL}}</div></div>
      </div>
    </div>

    <div class="bottom">
      <div class="tags">
        <span class="t">{{TAG1}}</span><span class="t">{{TAG2}}</span><span class="t">{{TAG3}}</span>
      </div>
      <div class="handle"><span class="logo"></span>{{HANDLE}}</div>
    </div>
  </div>
</body>
</html>
